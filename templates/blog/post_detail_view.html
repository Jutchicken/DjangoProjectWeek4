{% extends 'blog/Base.html' %}
{% block title %}
    {{ object.title }}
{% endblock %}
{% block content %}
    <h1>Post Detail View</h1>
    <a href="{% url 'post_update_view' object.id %}">Update</a>
    <p>
        {{ object.title }}
    </p>
    <p>
        {{ object.body }}
    </p>
    <p>
        {{ object.snippet }}
    </p>
{% endblock %}
