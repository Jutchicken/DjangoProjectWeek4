{% extends 'blog/Base.html' %}
{% block title %}
    Post Delete View
{% endblock %}
{% block content %}
    <h1>Post Delete View</h1>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete this post?</p>
        <button class="btn btn-danger" type="submit">Delete</button>
    </form>
{% endblock %}
